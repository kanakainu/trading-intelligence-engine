id: BYS-C027
name: Inside Bar
aliases:
- IB
- inside candle
- contained bar
- NR bar
category: Concept
definition: A candlestick whose complete range — from high to low — is contained within
  the high-to-low range of the immediately preceding candle, indicating a period of
  reduced volatility and directional indecision relative to the prior bar.
characteristics:
- High is lower than or equal to the prior candle's high
- Low is higher than or equal to the prior candle's low
- Entire price range is contained within the prior bar's range
- Represents contraction of volatility relative to the preceding bar
- The containing prior bar is called the mother bar
notes: Inside bar is defined by range containment (high-low), not body containment.
  Multiple consecutive inside bars indicate progressive compression. The pattern is
  directionally neutral.
