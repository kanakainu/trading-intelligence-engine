id: BYS-C013
name: Liquidity
aliases:
- market liquidity
- available liquidity
- resting liquidity
category: Concept
definition: The aggregate of resting orders — stops, limits, and pending orders —
  present at or near specific price levels that, when triggered, facilitate the execution
  of larger opposing orders.
characteristics:
- Exists at price levels where a concentration of orders is expected
- Includes stop-loss orders, take-profit orders, and pending limit orders
- Becomes available to the market when price reaches the level triggering those orders
- Concentrates at obvious technical levels such as swing highs, swing lows, and equal
  price levels
- Required by larger participants to fill positions without excessive slippage
notes: Liquidity is a structural concept describing the presence of orders at specific
  levels. It is directionally neutral and does not imply a specific outcome.
