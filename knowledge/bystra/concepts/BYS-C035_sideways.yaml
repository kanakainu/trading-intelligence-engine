id: BYS-C035
name: Sideways
aliases:
- ranging market
- lateral movement
- horizontal trend
- chop
- range-bound
category: Concept
definition: A market condition in which price oscillates horizontally within a bounded
  range, forming neither higher highs and higher lows nor lower highs and lower lows,
  indicating equilibrium between buying and selling pressure over the observed period.
characteristics:
- No net directional displacement over the observed period
- Swing highs cluster near a common upper boundary
- Swing lows cluster near a common lower boundary
- Neither bullish nor bearish structure is sustained
- Often characterized by overlapping candles and reduced momentum
notes: Sideways describes the absence of sustained trend structure rather than any
  specific pattern. It may occur at any timeframe and is the defining condition of
  consolidation phases.
