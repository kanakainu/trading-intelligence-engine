id: BYS-C041
name: Support
aliases:
- support level
- support zone
- demand floor
- price floor
category: Concept
definition: A price level or zone at which downward price movement has previously
  stalled or reversed, reflecting a historical concentration of demand sufficient
  to absorb available supply at that level.
characteristics:
- Price has previously reversed upward from the level at least once
- The level is defined by prior swing lows or congestion zones
- Represents a price at which demand has historically exceeded supply
- Can be a precise price level or a broader zone depending on context
- Significance increases with the number of times the level has been respected
notes: Support is a historical structural observation, not a guarantee of future behavior.
  A support level that is broken may subsequently act as resistance.
