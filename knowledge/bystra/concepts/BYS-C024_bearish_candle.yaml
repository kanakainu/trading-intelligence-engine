id: BYS-C024
name: Bearish Candle
aliases:
- down candle
- red candle
- negative candle
- decline candle
category: Concept
definition: A candlestick in which the closing price is lower than the opening price,
  indicating that sellers dominated price movement over the candle's time period.
characteristics:
- Close price is below open price
- Body color is conventionally red or black
- Body spans from close (bottom) to open (top)
- Upper wick extends from open to the period high
- Lower wick extends from close to the period low
notes: A bearish candle describes the net result of selling versus buying pressure
  within its time period. Body size relative to wicks indicates the degree of seller
  conviction over the period.
