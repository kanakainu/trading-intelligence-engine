id: BYS-C021
name: Resting Orders
aliases:
- pending orders
- limit orders
- dormant orders
- sitting orders
category: Concept
definition: Orders placed in the market at a specific price level that have not yet
  been triggered, including stop-loss orders, take-profit orders, and limit entry
  orders waiting for price to reach them.
characteristics:
- Exist at specific price levels in the order book or as conditional orders
- Remain inactive until price reaches the specified trigger level
- Include stop-losses, limit entries, and take-profit orders from all active positions
- Represent latent supply or demand not yet reflected in executed price action
- Concentrate at predictable structural levels where traders conventionally place
  orders
notes: Resting orders are the raw material of liquidity pools. Their presence at a
  level is inferred from price structure and trader behavior rather than directly
  observed in most retail contexts.
