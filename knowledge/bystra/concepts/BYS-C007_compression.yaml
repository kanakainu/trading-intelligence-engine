id: BYS-C007
name: Compression
aliases:
- range compression
- volatility compression
- squeeze
- coiling
category: Concept
definition: A phase of decreasing price range and momentum in which candles display
  smaller bodies, narrower spreads, and reduced displacement per bar, reflecting diminishing
  directional conviction.
characteristics:
- Candle bodies and total range decrease relative to recent bars
- Price moves less distance per unit of time
- Often associated with contracting volume or participation
- Frequently precedes a period of expansion
- Can manifest as inside bars, doji clusters, or tight ranging
notes: Compression is the counterpart to expansion. It describes the coiling of energy
  within the market and is often observed before significant directional moves.
