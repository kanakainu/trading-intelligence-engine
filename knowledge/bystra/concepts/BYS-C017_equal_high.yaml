id: BYS-C017
name: Equal High
aliases:
- EQH
- double top level
- equal highs
- matching highs
category: Concept
definition: A price structure in which two or more swing highs occur at approximately
  the same price level, creating a horizontal cluster that signals a concentration
  of resting sell-stop orders just above that level.
characteristics:
- Two or more swing highs share the same or nearly identical price
- The shared price level is visually prominent on the chart
- Implies a concentration of stop-loss orders from short positions and pending sell
  orders above the level
- The horizontal alignment makes the level conspicuous and therefore a target for
  liquidity
- Can form at any timeframe or degree of trend
notes: Equal highs are structurally significant because the repeated failure to break
  above a level concentrates orders at that point. The proximity threshold for "equal"
  is contextual and instrument-specific.
