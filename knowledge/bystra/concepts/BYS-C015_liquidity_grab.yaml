id: BYS-C015
name: Liquidity Grab
aliases:
- grab
- liq grab
- stop grab
- order grab
category: Concept
definition: A price move that briefly extends beyond a key structural level where
  resting orders are concentrated, triggering those orders before price returns back
  within the prior range or structure.
characteristics:
- Price penetrates a level where stops or pending orders reside
- The penetration is short-lived — price does not sustain beyond the level
- Triggers the resting orders at or beyond the structural level
- Often leaves a wick or spike on the candle that penetrated the level
- The returning price move reflects order absorption from the triggered liquidity
notes: A liquidity grab describes the mechanism of order triggering at a structural
  level. It does not specify direction of the subsequent move beyond what the structure
  implies.
