id: BYS-C008
name: Breakout
aliases:
- break
- price break
- level break
- structure break
category: Concept
definition: The movement of price beyond a previously established boundary, such as
  a consolidation range, swing high, swing low, or key structural level, indicating
  a potential shift in the supply-demand balance at that level.
characteristics:
- Price closes beyond a defined structural boundary
- The violated level was previously respected multiple times
- Often accompanied by increased momentum or range
- The breached level may subsequently act as support or resistance
- Can be genuine (sustained) or false (price returns inside the boundary)
notes: A breakout is defined by the price level breached and the context of that level,
  not by a specific candle pattern. False breakouts are recognized after the fact
  when price fails to sustain beyond the boundary.
