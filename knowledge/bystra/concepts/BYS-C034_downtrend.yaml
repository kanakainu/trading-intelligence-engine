id: BYS-C034
name: Downtrend
aliases:
- bearish trend
- falling trend
- downward trend
- bear trend
category: Concept
definition: A market condition characterized by a sequence of lower highs and lower
  lows, where each successive peak and trough is positioned below the prior peak and
  trough, indicating sustained dominance of selling pressure over time.
characteristics:
- Successive swing highs are lower than prior swing highs
- Successive swing lows are lower than prior swing lows
- Net directional displacement is downward over the observed period
- Price spends more time moving down than up within the sequence
- The pattern of lower highs and lower lows defines the structure
notes: A downtrend is defined by the sequence of swing structure, not by any single
  candle or indicator. Degree depends on timeframe and swing definition used.
