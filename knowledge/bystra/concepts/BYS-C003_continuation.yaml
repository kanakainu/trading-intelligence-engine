id: BYS-C003
name: Continuation
aliases:
- trend continuation
- directional continuation
category: Concept
definition: The resumption of a price move in the same direction as the prior dominant
  impulse after a period of retracement or consolidation.
characteristics:
- Price resumes the prior impulse direction
- Prior structure highs or lows are extended
- Follows a recognizable pause, pullback, or base
- Momentum character is consistent with the original impulse
- Trend structure is preserved or extended
notes: Continuation describes the outcome of a sequence (impulse → pause → impulse)
  rather than any single candle or bar.
