id: BYS-C016
name: Liquidity Sweep
aliases:
- sweep
- stop sweep
- liq sweep
- range sweep
category: Concept
definition: A price movement that clears liquidity from multiple levels across a range,
  triggering a series of resting orders in sequence as price moves through them, typically
  in a rapid, impulsive manner.
characteristics:
- Price moves through multiple order-bearing levels in a single continuous move
- Multiple stop clusters or liquidity pools are triggered sequentially
- Often occurs with elevated momentum and range expansion
- Distinct from a grab in that it covers a wider range and multiple levels
- The swept levels represent cleared order activity no longer available
notes: A liquidity sweep is broader in scope than a liquidity grab. After a sweep,
  the cleared levels may act differently as structural references because the orders
  that defined them have been consumed.
