id: BYS-C036
name: Higher High
aliases:
- HH
- new high
- ascending high
category: Concept
definition: A swing high that is positioned above the immediately preceding swing
  high in the same trend sequence, confirming continued upward structural progression.
characteristics:
- The current swing high price exceeds the prior swing high price
- Confirmed only after the swing high is fully formed with lower highs on both sides
- One of two structural conditions required to define an uptrend
- Each successive higher high marks a new peak in the uptrend sequence
- Failure to form a higher high is the first structural warning of trend weakness
notes: Higher high is a relational descriptor comparing two consecutive swing highs.
  Its significance depends on the degree of the swings being compared — minor swings
  produce minor higher highs; major swings produce major higher highs.
