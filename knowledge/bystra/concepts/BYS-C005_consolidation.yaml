id: BYS-C005
name: Consolidation
aliases:
- range
- ranging
- base
- chop
category: Concept
definition: A market condition in which price oscillates within a bounded range, exhibiting
  no clear directional bias, as opposing forces of supply and demand reach temporary
  equilibrium.
characteristics:
- Price oscillates between a defined high and low boundary
- No sustained higher highs or lower lows are formed
- Candle bodies tend to be smaller than impulse-phase candles
- Volume may contract relative to prior impulse phases
- Range boundaries act as reference levels for directional resolution
notes: Consolidation can occur at any degree of trend and is often a precursor to
  a new directional move. It is defined by the absence of trend structure, not the
  presence of a specific pattern.
