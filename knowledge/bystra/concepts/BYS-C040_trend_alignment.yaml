id: BYS-C040
name: Trend Alignment
aliases:
- multi-timeframe alignment
- directional alignment
- timeframe confluence
category: Concept
definition: The condition in which the directional bias of a market is consistent
  across multiple timeframes simultaneously, with higher timeframe and lower timeframe
  trend structures pointing in the same direction.
characteristics:
- Higher timeframe trend direction matches lower timeframe trend direction
- Structural sequences (HH/HL or LH/LL) are directionally consistent across timeframes
- The degree of alignment can involve two or more timeframes
- Misalignment means different timeframes show opposing directional structures
- Full alignment means all observed timeframes share the same directional bias
notes: Trend alignment is a descriptive state, not a signal. It characterizes the
  degree of directional consensus across timeframes without implying any specific
  action.
