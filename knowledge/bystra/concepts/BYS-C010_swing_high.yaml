id: BYS-C010
name: Swing High
aliases:
- local high
- pivot high
- reaction high
- swing top
category: Concept
definition: A price peak formed when a bar's high is greater than the highs of the
  bars immediately preceding and following it, marking a point at which upward price
  movement temporarily reversed or stalled.
characteristics:
- The high of the pivot bar exceeds the highs of surrounding bars
- Defined by at least one lower high on each side (context-dependent)
- Represents a point of temporary supply dominance
- Can be major (significant structural) or minor (smaller degree)
- Forms the reference points used to identify trend structure
notes: The number of confirming bars on each side (e.g., 1, 2, or 3) is a parameter
  that defines the sensitivity of swing identification. Higher confirmation bars yield
  more significant swings.
