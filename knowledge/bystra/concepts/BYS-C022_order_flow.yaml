id: BYS-C022
name: Order Flow
aliases:
- trade flow
- market order flow
- delta
- transaction flow
category: Concept
definition: The sequence and volume of buy and sell orders being executed in the market
  at any given time, representing the actual transactional activity that drives price
  movement.
characteristics:
- Reflects real-time execution of market orders against the order book
- Determines the immediate direction and speed of price movement
- Imbalance between buying and selling pressure moves price
- Can be observed through volume, delta, and tape reading
- Distinguishes between passive (limit) and aggressive (market) order activity
notes: Order flow is the most direct representation of supply and demand in action.
  It differs from price action in that it describes the orders causing price to move
  rather than the resulting price movement itself.
