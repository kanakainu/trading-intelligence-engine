id: BYS-EP008
name: Reversal Entry
aliases:
- Counter-Trend Entry
- Reversal Trigger
- Turn Entry
category: Concept
version: '1.0'
definition: Entry against the prior trend direction at a key structural level after
  reversal signals appear.
trigger_description: After a trending move, price reaches a significant structure
  or zone, shows a reversal pattern, and a confirmation candle triggers entry.
prerequisites:
- Significant structure or zone reached
- Reversal candle or pattern visible
- Prior trend momentum exhausted
invalidation: Price breaks structure confirming trend continuation instead of reversing.
