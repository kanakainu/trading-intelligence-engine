id: BYS-EP011
name: Demand Reaction Entry
aliases:
- Demand Zone Entry
- Buy Zone Entry
- DR Entry
category: Concept
version: '1.0'
definition: Entry triggered at a demand zone when price arrives and shows a positive
  reaction confirming demand presence.
trigger_description: Price reaches a demand zone and a reaction candle (rejection,
  engulfing, or momentum) confirms buying interest at the zone.
prerequisites:
- Demand zone identified
- Price arrives at zone
- Reaction candle visible at zone
invalidation: Price passes through demand zone without reaction or closes below zone.
