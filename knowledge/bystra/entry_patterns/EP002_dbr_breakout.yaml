id: BYS-EP002
name: DBR Breakout Entry
aliases:
- DBR Break
- Drop-Base-Rally Breakout
category: Concept
version: '1.0'
definition: Entry triggered when price breaks above the high of the Base within a
  DBR structure, confirming bullish reversal.
trigger_description: A candle closes above the Base High of the DBR structure after
  an initial drop.
prerequisites:
- DBR structure identified
- Base formed after initial drop
- Base High clearly defined
invalidation: Price closes below Base Low before breakout occurs.
