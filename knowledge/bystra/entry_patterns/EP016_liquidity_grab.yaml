id: BYS-EP016
name: Liquidity Grab Entry
aliases:
- Grab Entry
- Stop Hunt Entry
- LGE
category: Concept
version: '1.0'
definition: Entry triggered after a liquidity grab — institutional activity triggered
  stop orders then reversed, providing entry.
trigger_description: After price grabs liquidity at a pool (triggering stops), a reversal
  candle confirms the grab is complete and direction is set.
prerequisites:
- Liquidity pool identified
- Stop orders triggered (price extends beyond pool)
- Reversal candle confirms direction
invalidation: Price fails to reverse after grab and continues in grab direction.
