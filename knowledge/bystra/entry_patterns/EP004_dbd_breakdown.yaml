id: BYS-EP004
name: DBD Breakdown Entry
aliases:
- DBD Break
- Drop-Base-Drop Breakdown
category: Concept
version: '1.0'
definition: Entry triggered when price breaks below the low of the Base within a DBD
  structure, confirming bearish continuation.
trigger_description: A candle closes below the Base Low of the DBD structure after
  an initial drop.
prerequisites:
- DBD structure identified
- Base formed after initial drop
- Base Low clearly defined
invalidation: Price closes above Base High before breakdown occurs.
