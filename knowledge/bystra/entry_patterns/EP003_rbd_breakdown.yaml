id: BYS-EP003
name: RBD Breakdown Entry
aliases:
- RBD Break
- Rally-Base-Drop Breakdown
category: Concept
version: '1.0'
definition: Entry triggered when price breaks below the low of the Base within an
  RBD structure, confirming bearish reversal.
trigger_description: A candle closes below the Base Low of the RBD structure after
  an initial rally.
prerequisites:
- RBD structure identified
- Base formed after initial rally
- Base Low clearly defined
invalidation: Price closes above Base High before breakdown occurs.
