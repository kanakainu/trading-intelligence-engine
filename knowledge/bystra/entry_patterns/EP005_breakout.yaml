id: BYS-EP005
name: Breakout Entry
aliases:
- Level Break Entry
- Zone Break Entry
category: Concept
version: '1.0'
definition: Entry triggered at the moment price breaks beyond a defined key level
  or zone boundary with momentum.
trigger_description: A candle closes decisively beyond the key level, confirming the
  break is valid and not a wick.
prerequisites:
- Key level or zone clearly identified
- Level has been tested previously
- Momentum visible on breakout candle
invalidation: Price wicks beyond level but closes back inside without follow-through.
