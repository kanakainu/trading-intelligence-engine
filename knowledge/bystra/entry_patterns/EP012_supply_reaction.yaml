id: BYS-EP012
name: Supply Reaction Entry
aliases:
- Supply Zone Entry
- Sell Zone Entry
- SR Entry
category: Concept
version: '1.0'
definition: Entry triggered at a supply zone when price arrives and shows a negative
  reaction confirming supply presence.
trigger_description: Price reaches a supply zone and a reaction candle (rejection,
  engulfing, or momentum) confirms selling interest at the zone.
prerequisites:
- Supply zone identified
- Price arrives at zone
- Reaction candle visible at zone
invalidation: Price passes through supply zone without reaction or closes above zone.
