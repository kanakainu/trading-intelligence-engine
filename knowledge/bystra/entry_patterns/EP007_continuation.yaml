id: BYS-EP007
name: Continuation Entry
aliases:
- Trend Continuation
- With-Trend Entry
- Pullback Entry
category: Concept
version: '1.0'
definition: Entry in the direction of the prevailing trend after a pullback provides
  a lower-risk re-entry point.
trigger_description: After a trending move, price pulls back to a structure or zone,
  shows rejection, and a candle confirms trend continuation.
prerequisites:
- Clear trend direction established
- Pullback to structure or zone
- Rejection signal at pullback level
invalidation: Pullback breaks the structure that defines the trend.
