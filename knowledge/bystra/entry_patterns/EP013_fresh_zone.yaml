id: BYS-EP013
name: Fresh Zone Entry
aliases:
- Unmitigated Entry
- Virgin Zone Entry
- FZE
category: Concept
version: '1.0'
definition: Entry triggered at a fresh (unmitigated) zone — highest probability zone
  entry as original orders likely intact.
trigger_description: Price arrives at a fresh zone for the first time since its creation
  and shows a reaction confirming order presence.
prerequisites:
- Fresh zone confirmed (not yet retested)
- Price approaches zone for first time
- Reaction signal visible
invalidation: Zone has been previously retested (becomes mitigation zone, lower probability).
