id: BYS-EP001
name: RBR Breakout Entry
aliases:
- RBR Break
- Rally-Base-Rally Breakout
category: Concept
version: '1.0'
definition: Entry triggered when price breaks above the high of the Base within an
  RBR structure.
trigger_description: A candle closes above the Base High of the RBR structure, confirming
  the second rally leg is beginning.
prerequisites:
- RBR structure identified
- Base formed after initial rally
- Base High clearly defined
invalidation: Price closes below Base Low before breakout occurs.
