- Second Chance Entry
- MZE
category: Concept
version: '1.0'
definition: Entry at a mitigation zone where remaining orders are expected to still
  react, providing a second-chance setup.
trigger_description: Price returns to a previously tested zone and shows a reaction
  confirming remaining orders are still active.
prerequisites:
- Mitigation zone identified
- Prior reaction at zone established
- New reaction signal visible on return
invalidation: Price passes through mitigation zone with no reaction.
