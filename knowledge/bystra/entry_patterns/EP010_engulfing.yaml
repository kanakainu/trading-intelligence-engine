id: BYS-EP010
name: Engulfing Entry
aliases:
- Engulf Entry
- Body Confirmation Entry
- Momentum Entry
category: Concept
version: '1.0'
definition: Entry triggered by an engulfing candle that confirms a shift in momentum
  at a key structure or zone.
trigger_description: A candle body fully engulfs the prior candle body in the opposite
  direction, appearing at a key structure or zone.
prerequisites:
- Key zone or structure identified
- Engulfing candle forms at zone
- Body direction aligned with trade
invalidation: Engulfing candle fails to close beyond the prior candle's open.
