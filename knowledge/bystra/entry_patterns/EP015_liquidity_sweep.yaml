id: BYS-EP015
name: Liquidity Sweep Entry
aliases:
- Sweep Entry
- Post-Sweep Entry
- LSE
category: Concept
version: '1.0'
definition: Entry triggered after a liquidity sweep — price swept a key liquidity
  pool and reversed, confirming the trap is complete.
trigger_description: After price sweeps a liquidity area (equal highs/lows, swing
  point) and reversal momentum appears, entry confirmed.
prerequisites:
- Liquidity pool or equal high/low identified
- Price sweeps beyond key level
- Reversal candle confirms directional intent
invalidation: Price continues beyond sweep level without reversal.
