id: BYS-EP006
name: Retest Entry
aliases:
- B&R Entry
- Break and Retest
- Pullback to Level
category: Concept
version: '1.0'
definition: Entry triggered after price breaks a level, pulls back to retest it, and
  shows rejection at the retested level.
trigger_description: After a valid breakout, price returns to the broken level and
  a rejection candle or pattern appears, confirming the level has flipped.
prerequisites:
- Prior breakout of key level confirmed
- Price returns to broken level
- Rejection signal visible at level
invalidation: Price passes through the retested level without rejection.
