id: BYS-EP009
name: Rejection Entry
aliases:
- Pin Bar Entry
- Wick Entry
- Level Rejection Entry
category: Concept
version: '1.0'
definition: Entry triggered by a candle showing a long wick rejecting a key level
  — confirming price was refused at that zone.
trigger_description: A candle with a long wick pointing at the zone closes away from
  the zone, confirming rejection of the level.
prerequisites:
- Key zone or level identified
- Long wick candle appears at zone
- Wick points toward and away from level
invalidation: Price closes in the direction of the wick instead of away from it.
