id: BYS-ST013
name: Range
aliases:
- Horizontal Range
- Trading Range
- Box
- Consolidation Box
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Structure where price oscillates between defined horizontal support and
  resistance levels.
sequence:
- Support Level
- Oscillation
- Resistance Level
components:
  support_level: Lower horizontal boundary with multiple touches
  oscillation: Price movement between boundaries
  resistance_level: Upper horizontal boundary with multiple touches
characteristics:
- Minimum 2 touches on each boundary
- Boundaries approximately horizontal
- Price contained within boundaries
- No clear directional trend
invalidation: Price closes decisively outside boundaries with momentum.
