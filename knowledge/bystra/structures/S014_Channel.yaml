id: BYS-ST014
name: Channel
aliases:
- Price Channel
- Trending Channel
- Parallel Channel
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Structure where price moves between two parallel trendlines, either trending
  or horizontal.
sequence:
- Lower Trendline
- Price Oscillation
- Upper Trendline
components:
  lower_trendline: Connecting swing lows (support)
  price_oscillation: Price bouncing between both lines
  upper_trendline: Connecting swing highs (resistance)
characteristics:
- Two parallel trendlines
- Minimum 2 touch points on each line
- Can trend up, down, or sideways
- Price respects both boundaries
invalidation: Price breaks and closes outside either trendline with follow-through.
