definition: Structure where price range progressively narrows, indicating energy accumulation
  before expansion.
sequence:
- Initial Range
- Compression Phase
- Contraction Point
components:
  initial_range: Wide price movement establishing boundaries
  compression: Progressively narrowing candle ranges
  contraction: Minimal range, maximum energy
characteristics:
- Each successive swing has smaller range than prior
- Both highs and lows converge
- Volume typically decreases
- Precedes expansion
invalidation: Range expands without clean directional breakout.
