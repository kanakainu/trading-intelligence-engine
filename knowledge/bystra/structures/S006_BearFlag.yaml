category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Bearish continuation structure — sharp impulse down (pole) followed by
  upward channel (flag).
sequence:
- Pole
- Flag Channel
- Breakdown
components:
  pole: Strong bearish impulse (flagpole)
  flag: Upward parallel channel consolidation
  breakdown: Close below flag lower trendline
characteristics:
- Pole is sharp and impulsive
- Flag drifts higher against trend
- Parallel channel visible
- Volume lower during flag
invalidation: Price breaks above flag upper trendline.
