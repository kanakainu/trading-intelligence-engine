version: '1.0'
abstraction_level: STRUCTURE
definition: Bearish continuation structure — impulse down, consolidation base, second
  impulse down.
sequence:
- Drop
- Base
- Drop
components:
  drop_leg: Bearish impulse creating new swing low
  base: Horizontal consolidation
  breakdown_leg: Bearish breakdown below base low
characteristics:
- Two bearish impulses separated by a base
- Base contained within prior drop range
- Second drop breaks below base low
invalidation: Price closes above base high before breakdown.
