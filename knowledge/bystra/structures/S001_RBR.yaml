id: BYS-ST001
name: Rally Base Rally
aliases:
- RBR
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Bullish continuation structure — impulse up, consolidation base, second
  impulse up.
sequence:
- Rally
- Base
- Rally
components:
  rally_leg: Bullish impulse creating a new swing high
  base: Horizontal consolidation with overlapping candles
  breakout_leg: Bullish breakout above base high
characteristics:
- Two bullish impulses separated by a base
- Base contained within prior rally range
- Second rally exceeds base high
invalidation: Price closes below base low before breakout.
