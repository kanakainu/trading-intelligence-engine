id: BYS-ST011
name: Quasimodo
aliases:
- QM
- QMR
- QML
- QMB
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Advanced reversal structure with a failed higher high (or lower low) followed
  by a break of prior swing.
sequence:
- Leg 1
- Shoulder
- Head
- Shoulder Break
components:
  leg_1: Initial impulse establishing first swing
  shoulder: First shoulder swing point
  head: Overextended swing (failed new high/low)
  shoulder_break: Break and close beyond shoulder level
characteristics:
- Head exceeds prior swing point
- Break of shoulder level confirms structure
- Asymmetric pattern
- Head represents last liquidity grab
invalidation: Price extends beyond head without reversal.
