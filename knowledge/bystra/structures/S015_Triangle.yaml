id: BYS-ST015
name: Triangle
aliases:
- Converging Triangle
- Symmetrical Triangle
- Wedge
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Structure where price action forms converging highs and lows, indicating
  compression before breakout.
sequence:
- First Swing
- Converging Swings
- Apex
components:
  first_swing: Initial wide swing establishing first boundary touch
  converging_swings: Progressive tightening of swing highs and lows
  apex: Point of maximum compression where lines converge
characteristics:
- Highs decreasing or flat
- Lows increasing or flat
- Lines converge toward apex
- Volume typically decreases to apex
invalidation: Price closes outside triangle before reaching apex (premature break).
