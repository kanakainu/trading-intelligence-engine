id: BYS-ST010
name: Double Bottom
aliases:
- DB
- W-Pattern
- Twin Troughs
category: Structure
version: '1.0'
abstraction_level: STRUCTURE
definition: Bullish reversal structure — two swing lows at approximately same level
  separated by a peak.
sequence:
- First Trough
- Peak
- Second Trough
- Breakout
components:
  first_trough: Initial swing low
  peak: Rally between troughs (neckline reference)
  second_trough: Second swing low near first trough level
  breakout: Close above peak high
characteristics:
- Two troughs at similar price level
- Equal or near-equal lows
- Peak between troughs
- Second trough may be slightly higher
invalidation: Price breaks below second trough low.
