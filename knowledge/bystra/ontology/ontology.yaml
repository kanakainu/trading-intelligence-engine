objects:

  # ── Concept ───────────────────────────────────────────────────────────────

  - id: BYS-C001
    name: Price Action
    category: Concept
    version: "1.0"
    status: ACTIVE
    description: Movement of price over time without indicators.
    aliases: [PA, Raw Price, Naked Chart]
    tags: [core, price, movement]

  - id: BYS-C002
    name: Market Structure
    category: Concept
    version: "1.0"
    status: ACTIVE
    description: Framework of highs and lows defining trend direction.
    aliases: [Structure, MS]
    tags: [core, trend, highs, lows]

  - id: BYS-C003
    name: Momentum
    category: Concept
    version: "1.0"
